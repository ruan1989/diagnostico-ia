# CI do InvestAI (investment-analyzer/).
#
# O escopo é deliberadamente o diretório do projeto: `backend/` é código
# anterior e sem testes, e incluí-lo aqui deixaria o CI vermelho por motivos
# que nada têm a ver com uma mudança no analisador.
#
# A suíte roda offline, com provedor sintético determinístico e timestamp
# fixo. Nenhum job precisa de rede, chave de API ou segredo — se algum dia um
# teste passar a exigir isso, ele está errado, não o CI.
name: investment-analyzer

on:
  # Em `push` só a branch principal: em branch de PR o gatilho `pull_request`
  # já cobre, e ter os dois faria cada commit rodar a suíte duas vezes.
  push:
    branches: [main]
    paths:
      - 'investment-analyzer/**'
      - '.github/workflows/investment-analyzer.yml'
  pull_request:
    paths:
      - 'investment-analyzer/**'
      - '.github/workflows/investment-analyzer.yml'

# Push novo na mesma referência cancela a execução anterior: revisor não
# precisa de resultado de commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: investment-analyzer

jobs:
  testes:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Sem fail-fast: saber que 3.11 passa e 3.13 quebra vale mais do que
      # cancelar os outros jobs assim que o primeiro falha.
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            investment-analyzer/requirements.txt
            investment-analyzer/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar a suíte
        # `pythonpath = ["src"]` já vem do pyproject.toml, então não é preciso
        # instalar o pacote para importar `investai`.
        run: python -m pytest -q --durations=10

  estatica:
    name: análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            investment-analyzer/requirements.txt
            investment-analyzer/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyflakes

      - name: pyflakes
        run: python -m pyflakes src/investai/ tests/ scripts/

      - name: Sintaxe do painel
        # O painel não tem build nem bundler: um erro de sintaxe no JS só
        # apareceria abrindo a página. Esta checagem o pega antes.
        run: node --check src/investai/web/app.js

      - name: Configuração consistente
        # `Settings.validar()` cruza os blocos de configuração (por exemplo,
        # primeiro alvo do plano contra o R:R mínimo). Já houve uma combinação
        # padrão em que NENHUM sinal poderia passar; isto impede o retorno.
        run: |
          PYTHONPATH=src python -c "
          from investai.config import Settings
          s = Settings()
          s.validar()
          print('configuração padrão consistente')
          "

  vazamento:
    name: auditoria de lookahead
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            investment-analyzer/requirements.txt
            investment-analyzer/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Auditar o caminho de features e rótulos
        # Lookahead é o defeito mais caro deste sistema e o mais fácil de
        # introduzir sem perceber: uma fatia com um índice a mais produz
        # backtest excelente e conta vazia. Revisão de código não pega isso de
        # forma confiável; a prova de invariância de prefixo pega.
        #
        # Job separado da suíte de propósito: quando ele falha, a causa é
        # sempre a mesma e a correção é urgente, e isso tem de ficar visível
        # na lista de checks sem alguém precisar abrir o log do pytest.
        run: |
          PYTHONPATH=src python -c "
          import sys
          from investai.exchanges import SyntheticProvider
          from investai.analysis.features import SerieFeatures, extrair_features
          from investai.ml.amostras import rotular
          from investai.models import Side
          from investai.validation.leakage import (
              auditar_invariancia_de_prefixo, auditar_rotulagem,
              auditar_ordem_temporal, auditar_sentinela, juntar)

          velas = SyntheticProvider(seed=5, agora_ms=1726000000000).candles(
              'BTCUSDT', '1H', limit=1500)

          def serie_at(vs, i):
              return SerieFeatures('BTCUSDT', '1H', vs).at(i)

          def extrai(vs, i):
              return extrair_features('BTCUSDT', '1H', vs, indice=i)

          def rot(vs, i):
              e = vs[i].close
              return rotular(vs, i, side=Side.LONG, entry=e, stop=e * 0.98,
                             alvo=e * 1.04, max_barras=48)

          total = juntar(
              auditar_invariancia_de_prefixo(serie_at, velas, alvo='SerieFeatures'),
              auditar_sentinela(serie_at, velas, alvo='SerieFeatures'),
              auditar_invariancia_de_prefixo(extrai, velas, alvo='extrair_features'),
              auditar_sentinela(extrai, velas, alvo='extrair_features'),
              auditar_rotulagem(rot, velas, horizonte=48, alvo='rotular'),
              auditar_ordem_temporal([c.ts for c in velas], alvo='provider'),
          )
          print(total.texto())
          if total.veredicto != 'LIMPO':
              sys.exit(1)
          "
