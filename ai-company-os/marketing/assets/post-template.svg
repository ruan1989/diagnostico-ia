<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Company OS — post template">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="0.6" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- logo -->
  <g transform="translate(90,110)">
    <path d="M0,-22 L22,0 L0,22 L-22,0 Z" fill="url(#g)"/>
  </g>
  <text x="130" y="122" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#e6ebf5">Company<tspan fill="url(#g)"> OS</tspan></text>

  <!-- ÁREA EDITÁVEL: troque este título por post -->
  <text x="90" y="480" font-family="Inter, system-ui, sans-serif" font-size="74" font-weight="800" fill="#e6ebf5">
    <tspan x="90" dy="0">Pare de abrir</tspan>
    <tspan x="90" dy="90">10 sistemas.</tspan>
    <tspan x="90" dy="90" fill="url(#g)">Fale com a</tspan>
    <tspan x="90" dy="90" fill="url(#g)">sua empresa.</tspan>
  </text>

  <!-- rodapé / CTA -->
  <g transform="translate(90,930)">
    <rect width="320" height="72" rx="14" fill="url(#g)"/>
    <text x="160" y="47" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Testar 14 dias grátis</text>
  </g>
  <text x="90" y="1035" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#5b8cff">companyos.ai</text>
</svg>
