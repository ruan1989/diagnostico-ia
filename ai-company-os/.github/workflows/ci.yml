name: CI

on:
  push:
    paths: ["ai-company-os/**"]
  pull_request:
    paths: ["ai-company-os/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-company-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
