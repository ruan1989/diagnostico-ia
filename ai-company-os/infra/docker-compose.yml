# Infra de produção-alvo. O núcleo roda SEM isto (repos in-memory).
# Suba quando for plugar persistência real: `docker compose -f infra/docker-compose.yml up -d`
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicos
      POSTGRES_PASSWORD: aicos
      POSTGRES_DB: aicos
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aicos
      MINIO_ROOT_PASSWORD: aicos12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

volumes:
  pg:
  qdrant:
  minio:
